# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Debug

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    
    steps:
    - uses: actions/checkout@v5

    - name: Find VS installer
      shell: pwsh
      run: |
        Get-ChildItem "C:\Program Files\Microsoft Visual Studio\18\Enterprise" -Recurse -Filter "vs_setup.exe" | Select-Object FullName
        Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio\Installer" | Select-Object FullName

    - name: Install ATL component
      shell: cmd
      run: |
        "C:\Program Files\Microsoft Visual Studio\18\Enterprise\Common7\IDE\VSWixBootstrapper\vs_setup.exe" modify ^
            --installPath "C:\Program Files\Microsoft Visual Studio\18\Enterprise" ^
            --add Microsoft.VisualStudio.Component.VC.ATL ^
            --quiet --norestart
    
    - name: Register DIA SDK
      shell: pwsh
      run: |
        $dll = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\DIA SDK\bin\amd64\msdia140.dll"
        Write-Host "Registering: $dll"
        & regsvr32 /s $dll

    - name: Verify DIA registration
      shell: cmd
      run: |
        reg query HKCR\CLSID\{e6756135-1e65-4d17-8576-610761398c3c} /s

    - name: Check DIA DLL version
      shell: pwsh
      run: |
        (Get-Item "C:\Program Files\Microsoft Visual Studio\18\Enterprise\DIA SDK\bin\amd64\msdia140.dll").VersionInfo.FileVersion
    
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.3
    
    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /restore /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:PlatformToolset=v143 ${{env.SOLUTION_FILE_PATH}}

    - name: Run tests (console test EXE)
      shell: cmd
      run: |
        x64\Debug\OdrCop.exe TUs\x64\Debug > output.txt
        type output.txt
        fc output.txt golden.txt        
