# separate terms of service, privacy policy, and support
# documentation.

name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Debug

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    
    steps:
    - uses: actions/checkout@v5

    - name: Register DIA SDK
      shell: pwsh
      run: |
        $dll = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\DIA SDK\bin\amd64\msdia140.dll"
        Write-Host "Registering: $dll"
        & regsvr32 /s $dll
        $ver = (Get-Item $dll).VersionInfo
        Write-Host "DIA version: $($ver.FileMajorPart).$($ver.FileMinorPart).$($ver.FileBuildPart).$($ver.FilePrivatePart)"

    - name: Verify DIA registration
      shell: cmd
      run: |
        reg query HKCR\CLSID\{e6756135-1e65-4d17-8576-610761398c3c} /s

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.3
    
    - name: Show mspdbcore version
      shell: pwsh
      run: |
        $mspdbPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\*\bin\Hostx64\x64\mspdbcore.dll"
        $mspdb = Get-Item $mspdbPath | Select-Object -First 1
        Write-Host "mspdbcore path: $($mspdb.FullName)"
        Write-Host "mspdbcore version: $($mspdb.VersionInfo.FileVersion)"

    - name: List installed MSVC toolsets
      shell: pwsh
      run: |
        Get-ChildItem "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC\" |
          Select-Object Name

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /restore /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:PlatformToolset=v145 -p:VCToolsVersion=14.50.35717 ${{env.SOLUTION_FILE_PATH}}

    - name: Run tests (console test EXE)
      shell: cmd
      run: |
        x64\Debug\OdrCop.exe TUs\x64\Debug > output.txt
        type output.txt
        fc output.txt golden.txt        
